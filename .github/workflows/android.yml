name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Create Flutter Android app
        run: flutter create app --platforms android --project-name stlink_flasher --org com.example

      - name: Stage repository sources for the app assembler
        run: |
          mkdir -p android/res/xml lib
          cp ./*.kt android/
          cp device_filter.xml android/res/xml/
          cp ./*.dart lib/

      - name: Add file picker dependency
        run: |
          cd app
          flutter pub add 'file_picker:^8.0.0'

      - name: Assemble app
        run: python3 assemble_app.py

      - name: Build APK
        run: |
          cd app
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stlink-flasher-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
